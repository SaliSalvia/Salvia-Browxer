name: Android CI

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' && secrets.SIGNING_KEYSTORE_PASSWORD != '' && secrets.SIGNING_KEY_ALIAS != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run web unit tests, TypeScript check, and bundle into Android assets
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
          npx tsx --test src/core/browserCore.test.ts src/core/linkPatternEngine.test.ts
          npm run lint
          npm run build
          rm -rf app/src/main/assets/www
          mkdir -p app/src/main/assets/www
          cp -r dist/* app/src/main/assets/www/
          test -f app/src/main/assets/www/index.html || { echo "assets/www/index.html missing"; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle and restore dependency cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-provider: basic

      - name: Verify Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests and lint
        run: |
          set -o pipefail
          ./gradlew clean :app:testDebugUnitTest :app:lintDebug --stacktrace --no-daemon

      - name: Build Debug & Release APK/AAB
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :app:assembleRelease :app:bundleRelease --stacktrace --no-daemon

      - name: Verify release APK signature when signed
        if: ${{ env.HAS_SIGNING == 'true' }}
        run: |
          "$ANDROID_HOME"/build-tools/36.0.0/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk
