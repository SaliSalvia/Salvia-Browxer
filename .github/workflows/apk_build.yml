name: APK Build

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/workflows/android_ci.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  apk:
    name: Build and extract APK
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' && secrets.SIGNING_KEYSTORE_PASSWORD != '' && secrets.SIGNING_KEY_ALIAS != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test, lint, and build web UI bundle into Android assets
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
          npx tsx --test src/core/browserCore.test.ts src/core/linkPatternEngine.test.ts
          npm run lint
          npm run build
          rm -rf app/src/main/assets/www
          mkdir -p app/src/main/assets/www
          cp -r dist/* app/src/main/assets/www/
          test -f app/src/main/assets/www/index.html || { echo "assets/www/index.html missing"; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode and verify keystore when signing secrets exist
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import base64, os, re
          from pathlib import Path
          raw = os.environ["SIGNING_KEYSTORE_BASE64"].strip()
          raw = re.sub(r"^data:[^;]+;base64,", "", raw, flags=re.I)
          raw = re.sub(r"\s+", "", raw).replace("-", "+").replace("_", "/")
          pad = len(raw) % 4
          if pad == 2: raw += "=="
          elif pad == 3: raw += "="
          out = Path(os.environ["RUNNER_TEMP"]) / "release-keystore.jks"
          out.write_bytes(base64.b64decode(raw, validate=False))
          PY
          KS="$RUNNER_TEMP/release-keystore.jks"
          echo "SIGNING_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"
          keytool -list -keystore "$KS" -storepass "$SIGNING_KEYSTORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" >/dev/null

      - name: Set up Gradle and restore dependency cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-provider: basic

      - name: Verify Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Verify Gradle wrapper
        run: |
          set -o pipefail
          test -f gradle/wrapper/gradle-wrapper.jar || { echo "gradle/wrapper/gradle-wrapper.jar is missing"; exit 1; }
          test -f gradle/wrapper/gradle-wrapper.properties || { echo "gradle/wrapper/gradle-wrapper.properties is missing"; exit 1; }
          unzip -t gradle/wrapper/gradle-wrapper.jar > /dev/null
          grep -q '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee gradle-debug.log

      - name: Build Release APK (R8 + shrink; signed when owner secrets exist)
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace --no-daemon 2>&1 | tee gradle-release.log

      - name: Extract APK and verify signature
        if: success()
        run: |
          set -o pipefail
          mkdir -p extracted-apk
          test -f app/build/outputs/apk/debug/app-debug.apk || { echo "debug APK missing"; exit 1; }
          cp app/build/outputs/apk/debug/app-debug.apk extracted-apk/app-debug.apk
          RELEASE_APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          test -n "$RELEASE_APK" || { echo "release APK missing"; exit 1; }
          cp "$RELEASE_APK" extracted-apk/
          if [ "$HAS_SIGNING" = "true" ]; then
            test -f extracted-apk/app-release.apk || { echo "expected signed app-release.apk"; exit 1; }
            "$ANDROID_HOME"/build-tools/36.0.0/apksigner verify --print-certs extracted-apk/app-release.apk | tee extracted-apk/signing-info.txt
          else
            echo "Signing secrets absent — release APK is unsigned." | tee extracted-apk/signing-info.txt
          fi

      - name: Upload extracted APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: salviabrowxer-apk
          path: extracted-apk/
          if-no-files-found: error
          retention-days: 30
